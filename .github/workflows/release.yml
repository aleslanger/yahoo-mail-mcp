name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  # Builds and scans with read-only permissions; third-party tools never run
  # in the job that can publish or request an OIDC token.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is annotated and on master
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - id: go
        run: |
          version=$(sed -n 's/^toolchain go//p' go.mod)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          # No cache: release binaries are built only from the checked-out tag.
          cache: false
      - name: Tag matches binary version
        run: test "v$(go run ./cmd/yahoo-mcp version)" = "$GITHUB_REF_NAME"
      - run: make check
      - run: make dist
      - name: Scan release binaries for known vulnerabilities
        run: for binary in dist/yahoo-mcp-*; do go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode binary "$binary"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Fetch the annotated tag for the release notes
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/yahoo-mcp-*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-from-tag $prerelease dist/SHA256SUMS dist/yahoo-mcp-*
